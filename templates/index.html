<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼音田字格默写纸生成器</title>
<style>
/* ===== 全局重置 ===== */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #f5f5f5;
    color: #333;
    min-height: 100vh;
}

/* ===== 顶部控制区 ===== */
.controls {
    max-width: 800px;
    margin: 0 auto;
    padding: 30px 20px;
}

.controls h1 {
    font-size: 24px;
    text-align: center;
    margin-bottom: 20px;
    color: #2c3e50;
}

.controls textarea {
    width: 100%;
    height: 120px;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    resize: vertical;
    font-family: inherit;
    transition: border-color 0.2s;
    line-height: 1.6;
}

.controls textarea:focus {
    outline: none;
    border-color: #3498db;
}

.controls .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.controls button {
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s, transform 0.1s;
}

.controls button:active {
    transform: scale(0.97);
}

.btn-generate {
    background: #3498db;
    color: #fff;
}

.btn-generate:hover {
    background: #2980b9;
}

.btn-print {
    background: #27ae60;
    color: #fff;
}

.btn-print:hover {
    background: #219a52;
}

.btn-clear {
    background: #e74c3c;
    color: #fff;
}

.btn-clear:hover {
    background: #c0392b;
}

/* ===== 选项开关 ===== */
.options {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    font-size: 14px;
}

.options label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
}

.options input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.title-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 14px;
}

.title-input-row input {
    padding: 6px 12px;
    font-size: 15px;
    border: 2px solid #ddd;
    border-radius: 6px;
    width: 200px;
    font-family: inherit;
    transition: border-color 0.2s;
}

.title-input-row input:focus {
    outline: none;
    border-color: #3498db;
}

.paper-title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #333;
    padding-bottom: 20px;
    letter-spacing: 4px;
}

/* ===== 结果区域 ===== */
.result-area {
    max-width: 210mm;
    margin: 0 auto;
    padding: 10px 20px 40px;
}

/* ===== 田字格纸张 ===== */
.paper {
    background: #fff;
    padding: 15mm 12mm;
    min-height: 297mm;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border-radius: 4px;
}

/* ===== 词语行 ===== */
.word-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 8px 16px;
    margin-bottom: 12px;
    page-break-inside: avoid;
    break-inside: avoid;
}

/* ===== 单个词语容器 ===== */
.word-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    page-break-inside: avoid;
    break-inside: avoid;
}

/* ===== 拼音行（四线三格） ===== */
.pinyin-row {
    display: flex;
    gap: 0;
    margin-bottom: 2px;
    height: 28px;
    align-items: flex-end;
}

.pinyin-cell {
    width: 50px;
    height: 28px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 14px;
    font-family: "Times New Roman", serif;
    color: #333;
    line-height: 1;
    padding-bottom: 1px;
}

.pinyin-cell.no-pinyin {
    /* 无拼音时无背景线条 */
}

/* ===== 田字格行 ===== */
.char-row {
    display: flex;
    gap: 3px;
}

/* ===== 单个田字格 ===== */
.char-cell {
    width: 58px;
    height: 58px;
    position: relative;
    border: 2px solid #000;
    background: #fff;
}

/* 竖线 - 虚线 */
.char-cell::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 100%;
    background: repeating-linear-gradient(
        to bottom,
        #ccc 0px,
        #ccc 3px,
        transparent 3px,
        transparent 5px
    );
}

/* 横线 - 虚线 */
.char-cell::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 100%;
    height: 1px;
    background: repeating-linear-gradient(
        to right,
        #ccc 0px,
        #ccc 3px,
        transparent 3px,
        transparent 5px
    );
}

/* 词语之间间距 */
.word-item + .word-item {
    margin-left: 4px;
}

/* ===== 空行占位 ===== */
.placeholder-row {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 14px;
}

/* ===== 打印样式 ===== */
@media print {
    body {
        background: #fff;
    }

    .controls {
        display: none !important;
    }

    .result-area {
        max-width: 100%;
        padding: 0;
    }

    .paper {
        box-shadow: none;
        border-radius: 0;
        padding: 15mm 12mm;
        min-height: auto;
        width: 210mm;
    }

    .char-cell {
        border-color: #000;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .char-cell::before,
    .char-cell::after {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .pinyin-cell {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .pinyin-cell.no-pinyin {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .word-row {
        page-break-inside: avoid;
        break-inside: avoid;
    }

    .word-item {
        page-break-inside: avoid;
        break-inside: avoid;
    }

    .paper-title {
        color: #000;
    }

    @page {
        size: A4;
        margin: 0;
    }
}

/* ===== 版权栏 ===== */
.footer-bar {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: #999;
    border-top: 1px solid #eee;
    margin-top: 20px;
}

@media print {
    .footer-bar {
        display: none !important;
    }
}

/* ===== 响应式 ===== */
@media screen and (max-width: 600px) {
    .controls {
        padding: 16px;
    }

    .controls h1 {
        font-size: 20px;
    }

    .result-area {
        padding: 8px;
    }

    .paper {
        padding: 8mm 6mm;
    }

    .char-cell {
        width: 48px;
        height: 48px;
    }

    .pinyin-cell {
        width: 40px;
        height: 24px;
        font-size: 13px;
    }

    .pinyin-row {
        height: 28px;
    }
}
</style>
</head>
<body>

<div class="controls">
    <h1>📝 拼音田字格默写纸生成器</h1>
    <div class="title-input-row">
        <label>纸张标题：</label>
        <input type="text" id="paperTitle" value="词语默写纸" maxlength="30">
    </div>
    <textarea id="inputText" placeholder="例如：方序 语文 默写，支持空格或逗号分隔"></textarea>
    <div class="options">
        <label>
            <input type="checkbox" id="showPinyin" checked>
            显示拼音
        </label>
        <label>
            <input type="checkbox" id="showPlaceholder" checked>
            显示空白田字格（用于默写）
        </label>
    </div>
    <div class="btn-row">
        <button class="btn-generate" onclick="generate()">生成默写纸</button>
        <button class="btn-print" onclick="printPaper()">🖨️ 打印</button>
        <button class="btn-clear" onclick="clearAll()">清空</button>
    </div>
</div>

<div class="result-area">
    <div class="paper" id="paper">
        <div class="paper-title" id="paperTitleDisplay">词语默写纸</div>
        <div class="placeholder-row">在上方输入词语，点击"生成默写纸"</div>
    </div>
</div>

<div class="footer-bar">
    <p>本网站用于给我的儿子打印单词纸，希望他学习进步！ —— 爱他的爸爸</p>
</div>

<script>
// ===== API 调用 =====
async function generate() {
    const text = document.getElementById('inputText').value.trim();
    if (!text) {
        alert('请输入词语！');
        return;
    }

    const showPinyin = document.getElementById('showPinyin').checked;
    const showPlaceholder = document.getElementById('showPlaceholder').checked;

    try {
        const resp = await fetch('/api/convert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });

        if (!resp.ok) {
            throw new Error('请求失败: ' + resp.status);
        }

        const data = await resp.json();
        renderPaper(data.words, showPinyin, showPlaceholder);
    } catch (err) {
        alert('生成失败: ' + err.message);
    }
}

// ===== 渲染田字格 =====
function renderPaper(words, showPinyin, showPlaceholder) {
    const paper = document.getElementById('paper');

    // 获取标题
    const titleText = document.getElementById('paperTitle').value.trim() || '词语默写纸';

    paper.innerHTML = '';

    // 添加标题
    const titleEl = document.createElement('div');
    titleEl.className = 'paper-title';
    titleEl.textContent = titleText;
    paper.appendChild(titleEl);

    if (!words || words.length === 0) {
        paper.innerHTML = '<div class="paper-title">词语默写纸</div><div class="placeholder-row">未识别到有效词语，请检查输入</div>';
        return;
    }

    for (const item of words) {
        const word = item.word;
        const pinyinList = item.pinyin;

        // 创建词语容器
        const wordDiv = document.createElement('div');
        wordDiv.className = 'word-item';

        // 拼音行
        const pinyinRow = document.createElement('div');
        pinyinRow.className = 'pinyin-row';

        for (let i = 0; i < word.length; i++) {
            const cell = document.createElement('div');
            cell.className = 'pinyin-cell';
            if (showPinyin && pinyinList && pinyinList[i]) {
                cell.textContent = pinyinList[i];
            } else {
                cell.classList.add('no-pinyin');
            }
            pinyinRow.appendChild(cell);
        }
        wordDiv.appendChild(pinyinRow);

        // 田字格行
        const charRow = document.createElement('div');
        charRow.className = 'char-row';

        for (let i = 0; i < word.length; i++) {
            const cell = document.createElement('div');
            cell.className = 'char-cell';
            if (!showPlaceholder) {
                // 如果不显示空白格，显示汉字
                cell.textContent = word[i];
                cell.style.display = 'flex';
                cell.style.alignItems = 'center';
                cell.style.justifyContent = 'center';
                cell.style.fontSize = '24px';
                cell.style.color = '#333';
            }
            charRow.appendChild(cell);
        }
        wordDiv.appendChild(charRow);

        // 将词语放入行容器
        // 查找或创建 word-row
        const rows = paper.querySelectorAll('.word-row');
        let currentRow;
        if (rows.length === 0) {
            currentRow = document.createElement('div');
            currentRow.className = 'word-row';
            paper.appendChild(currentRow);
        } else {
            currentRow = rows[rows.length - 1];
        }

        // 估算当前行宽度，如果超出则换行
        // 每个字58px + 词语间距
        const wordWidth = word.length * 58 + (word.length - 1) * 3 + 16;
        const currentWidth = Array.from(currentRow.children).reduce((sum, el) => {
            const w = el.querySelector('.char-row');
            if (w) {
                return sum + w.children.length * 58 + (w.children.length - 1) * 3 + 16;
            }
            return sum + 58;
        }, 0);

        if (currentWidth + wordWidth > 720) { // 约 A4 可用宽度（58px * 10 + 16px * 10 ≈ 740，取 720 确保 10 个字）
            const newRow = document.createElement('div');
            newRow.className = 'word-row';
            newRow.appendChild(wordDiv);
            paper.appendChild(newRow);
        } else {
            currentRow.appendChild(wordDiv);
        }
    }
}

// ===== 打印 =====
function printPaper() {
    // 如果还没有内容，先生成
    const paper = document.getElementById('paper');
    if (paper.querySelector('.placeholder-row')) {
        generate();
        // 延迟打印让渲染完成
        setTimeout(() => {
            window.print();
        }, 300);
    } else {
        window.print();
    }
}

// ===== 清空 =====
function clearAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('paper').innerHTML = '<div class="paper-title" id="paperTitleDisplay">词语默写纸</div><div class="placeholder-row">在上方输入词语，点击"生成默写纸"</div>';
}

// ===== 回车快捷键 =====
document.getElementById('inputText').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) {
        generate();
    }
});
</script>

</body>
</html>
